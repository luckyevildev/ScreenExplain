name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | tail -1)/Contents/Developer"
      - name: Проверки чистой логики
        run: bash Tests/run.sh
      - name: Сборка
        run: |
          xcodebuild -project ScreenExplain.xcodeproj -scheme ScreenExplain -configuration Debug \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E '\.swift:[0-9]+:[0-9]+: (warning|error)|BUILD'
          ! grep -qE '\.swift:[0-9]+:[0-9]+: (warning|error)' build.log
